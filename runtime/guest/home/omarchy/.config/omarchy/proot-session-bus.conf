<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <type>session</type>
  <keep_umask/>
  <listen>unix:tmpdir=/run/user/1000</listen>
  <auth>EXTERNAL</auth>

  <!-- Deliberately omit standard_session_servicedirs and session.d. The real
       Omarchy shell can still own and exchange D-Bus names, but unavailable
       desktop services cannot auto-spawn a portal/GVFS/accessibility swarm
       that trips Android's native-child limit. -->
  <policy context="default">
    <allow send_destination="*" eavesdrop="true"/>
    <allow eavesdrop="true"/>
    <allow own="*"/>
  </policy>

  <limit name="max_incoming_bytes">100000000</limit>
  <limit name="max_outgoing_bytes">100000000</limit>
  <limit name="max_message_size">100000000</limit>
  <limit name="max_completed_connections">1024</limit>
  <limit name="max_connections_per_user">1024</limit>
  <limit name="max_names_per_connection">4096</limit>
  <limit name="max_match_rules_per_connection">4096</limit>
</busconfig>
