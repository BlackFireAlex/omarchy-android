# Omarchy defaults retained for the Android build.
--ozone-platform=x11
--ozone-platform-hint=x11
--password-store=basic
--enable-features=TouchpadOverscrollHistoryNavigation,Vulkan,VulkanFromANGLE,DefaultANGLEVulkan
--load-extension=/usr/share/omarchy/default/chromium/extensions/copy-url,/usr/share/omarchy/default/chromium/extensions/yt-dlp,/usr/share/omarchy/default/chromium/extensions/whatsapp-slim

# Android exposes Adreno through KGSL rather than a DRM render node. ANGLE's
# Vulkan backend reaches the pinned Turnip driver directly; XWayland provides
# only the final local presentation bridge.
--use-gl=angle
--use-angle=vulkan
--disable-vulkan-surface
--ignore-gpu-blocklist
--enable-gpu-rasterization
--enable-zero-copy
--disable-gpu-sandbox
--no-sandbox
--disable-dev-shm-usage
